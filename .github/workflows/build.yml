name: Build patched Mylar3 image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'mylar/getcomics.py'
      - '.github/workflows/build.yml'
  schedule:
    # Weekly rebuild to track upstream linuxserver/mylar3:latest
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/brazimus/mylar3:patched
